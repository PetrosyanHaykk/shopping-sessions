name: Linux pipeline profiling
on:
  push:
    branches: [perf/linux-profiling]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install validation tools
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          python -m pip install polars
      - name: Build and verify both versions
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/shared-target"
          mkdir -p "$RUNNER_TEMP/binaries"
          for version in baseline grouped avx2; do
            if [ "$version" = baseline ]; then
              revision=e0ec4042aa64cc514bfcd4c892a696f2360d8e86
            elif [ "$version" = grouped ]; then
              revision=f43b27d2d41c48fca5e66d550687c7b2671d85e6
            else
              revision=82e5bd0eac2b2dda97dba4323c3cf3d83817c8ae
            fi
            git worktree add --detach "$RUNNER_TEMP/$version" "$revision"
            (cd "$RUNNER_TEMP/$version" && cargo +1.97.0 build --release --locked)
            cp "$CARGO_TARGET_DIR/release/shopping-sessions" "$RUNNER_TEMP/binaries/$version"
            python scripts/run_fixtures.py fixtures -- "$RUNNER_TEMP/binaries/$version"
          done
      - name: Generate official benchmark inputs and check the dev answer
        run: |
          curl --fail --location --retry 3 https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/generator.zip -o "$RUNNER_TEMP/generator.zip"
          curl --fail --location --retry 3 https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/dev-answer.zip -o "$RUNNER_TEMP/dev-answer.zip"
          unzip -q "$RUNNER_TEMP/generator.zip" -d "$RUNNER_TEMP/official"
          unzip -q "$RUNNER_TEMP/dev-answer.zip" -d "$RUNNER_TEMP/answer"
          (cd "$RUNNER_TEMP/official/generator" && cargo +1.97.0 build --release --locked)
          generate="$RUNNER_TEMP/official/generator/target/release/generate"
          "$generate" --seed 1 --events 1000000 --clicks 250000 --output "$RUNNER_TEMP/dev"
          answer=$(find "$RUNNER_TEMP/answer" -name user_daily.csv -printf '%h' -quit)
          for version in baseline grouped avx2; do
            DATA_DIR="$RUNNER_TEMP/dev" OUTPUT_DIR="$RUNNER_TEMP/dev-$version" "$RUNNER_TEMP/binaries/$version"
            python scripts/compare.py "$RUNNER_TEMP/dev-$version" "$answer"
          done
          "$generate" --seed 42 --events 5000000 --clicks 1250000 --output "$RUNNER_TEMP/data"
      - name: Measure the whole pipeline
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import statistics
          import subprocess
          import time
          root = Path(os.environ["RUNNER_TEMP"])
          times = {}
          lines = []
          for threads in sorted({1, os.cpu_count()}):
              for repeat in range(6):
                  versions = ["baseline", "grouped", "avx2"]
                  if repeat % 2:
                      versions.reverse()
                  for version in versions:
                      output = root / f"out-{version}"
                      env = dict(os.environ, DATA_DIR=str(root / "data"),
                                 OUTPUT_DIR=str(output), NCPU=str(threads), TIMING="1")
                      started = time.perf_counter()
                      result = subprocess.run([str(root / "binaries" / version)],
                                              env=env, capture_output=True, text=True, check=True)
                      elapsed = time.perf_counter() - started
                      if repeat:
                          times.setdefault(f"{version}/{threads} threads", []).append(elapsed)
                      lines.append(f"{version}, threads={threads}, repeat={repeat}, wall={elapsed:.6f}s")
                      lines.append(result.stderr)
                      print(lines[-2], flush=True)
                      print(result.stderr, flush=True)
              for candidate in ("grouped", "avx2"):
                  subprocess.run(["python", "scripts/compare.py",
                                  str(root / "out-baseline"), str(root / f"out-{candidate}")], check=True)
          summary = {key: {"median": statistics.median(values), "runs": values}
                     for key, values in times.items()}
          text = json.dumps(summary, indent=2)
          print(text)
          (root / "profile.txt").write_text("\n".join(lines) + "\n" + text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write("Official generator, seed 42: five million events and 1.25 million clicks.\n\n")
              handle.write("Competition hardware and hidden seeds may differ.\n\n")
              handle.write("~~~json\n" + text + "\n~~~\n")
      - uses: actions/upload-artifact@v4
        with:
          name: linux-profile
          path: ${{ runner.temp }}/profile.txt
